# The ops command center has no hook in a core script, so these rows are its
# whole integration with the runner.
# No upstream case maps bin/fm-order.sh or bin/fm-tray.sh.
# The only test text naming either path belongs to scripts the runner leaves
# unclassified, which fork_registry_assert_no_shadow treats as no answer, so
# these rows are legitimately exclusive today.
# tests/fm-deck.test.sh drives both real scripts and is a further owner of each
# path; the Action Deck group declares that below, where the deck's own sources
# are declared.
# bin/fm-tray.sh has two owners. Its own suite is one, and the order suite is
# the other: fm-order.sh list calls fm-tray.sh counts, so a tray change can
# break the order suite. The order suite never names the tray path as text, so
# upstream's reference fallback could not have found that owner at all.
covers bin/fm-order.sh tests/fm-order.test.sh
covers bin/fm-tray.sh tests/fm-tray.test.sh
covers bin/fm-tray.sh tests/fm-order.test.sh

# The captain's private reading, decision, chart-room and Action Deck surfaces
# have no hook in a core script either, so these rows are their whole
# integration with the runner. No upstream case maps any of these paths, and
# the only test text naming any of them belongs to scripts the runner leaves
# unclassified, which fork_registry_assert_no_shadow treats as no answer, so
# every row here is legitimately exclusive today.
#
# Two owners could not have been found by upstream's reference fallback at
# all, because the owning suite never names the path as text:
#   bin/fm-read.mjs      - bin/fm-chart-room.mjs imports its render(), so a
#                          change to the Markdown owner can break the chart
#                          room's report pages.
#   bin/fm-chart-room.sh - bin/fm-overlay.sh calls its `url` command to decide
#                          whether a report earns a chart-room link, and the
#                          overlay suite asserts the URL that call returns.
# One further owner the reference fallback does reach, but only as a family it
# cannot name:
#   bin/fm-deck.sh       - the phone bridge serves /deck from this script over
#                          the real repository root, so the bridge suite drives
#                          it and asserts the fm-deck.v1 model it emits.
#                          The bridge suite names the path as text, so the
#                          fallback finds it, but the bridge suite is a script
#                          the runner's own map leaves unclassified, so the only
#                          answer the fallback can give is the bare unclassified
#                          family. fork_registry_assert_no_shadow treats that
#                          answer as no answer at all, exactly as it treats
#                          __unmapped__, so the exclusive row here is still a
#                          legitimate override rather than a replacement.
covers bin/fm-decision-surface.sh tests/fm-decision-surface.test.sh
covers bin/fm-decision-surface.mjs tests/fm-decision-surface.test.sh
covers bin/fm-read.sh tests/fm-read.test.sh
covers bin/fm-read.mjs tests/fm-read.test.sh
covers bin/fm-read.mjs tests/fm-chart-room.test.sh
covers bin/fm-chart-room.sh tests/fm-chart-room.test.sh
covers bin/fm-chart-room.sh tests/fm-overlay.test.sh
covers bin/fm-chart-room.mjs tests/fm-chart-room.test.sh
covers bin/fm-overlay.sh tests/fm-overlay.test.sh
covers bin/fm-deck.sh tests/fm-deck.test.sh
covers bin/fm-deck.sh tests/fm-bridge-view.test.sh
covers bin/fm-deck-render.py tests/fm-deck.test.sh

# The further owner the ops rows above left for this group: tests/fm-deck.test.sh
# drives the real bin/fm-order.sh and bin/fm-tray.sh over a fixture gateway log
# and fixture order files, so a change to either ops source can break the deck
# suite.
covers bin/fm-order.sh tests/fm-deck.test.sh
covers bin/fm-tray.sh tests/fm-deck.test.sh

# The fork-surface check's config/secret knob pass requires every declared
# knob path to be ignored, so it is an extra .gitignore owner alongside the
# upstream owners the runner's own map already selects.
adds .gitignore tests/fm-fork-surface.test.sh
# The private-report assertion requires the watch's own output paths to be
# ignored, so it is a further .gitignore owner beside the upstream readers.
adds .gitignore tests/fm-upstream-watch.test.sh

