# The visible-format library, the title owner and the outcome resolver are
# fork-only presentation sources, but each is still named as text by some test
# in the suite (the runner's own test names the format library in its fixture,
# the spawn presentation test names the title owner, and the outcome resolver
# is named by its own test), so upstream's reference fallback reaches all
# three. These rows add the fork owners to that answer; a covers row would
# shadow a live upstream owner and fork_registry_assert_no_shadow refuses it.
adds bin/fm-visible-format-lib.sh tests/fm-visible-status.test.sh
adds bin/fm-visible-format-lib.sh tests/fm-herdr-layout-preview-e2e.test.sh
