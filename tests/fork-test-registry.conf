# release-stale in bin/fm-lock.sh dispatches into the fork's handoff library
# and fails closed without it, and only the handoff suite pins that refusal.
# Upstream still owns bin/fm-lock* through the runner's session-bootstrap
# branch, so this row adds an owner rather than replacing one.
adds bin/fm-lock.sh tests/fm-primary-handoff.test.sh

# The glasses file-event wake is carried entirely by its own library and python
# helper, and the only test naming either of them is its own suite, whose family
# now lives in this registry. The runner's own map therefore answers
# unclassified for both paths, which is the absence of a family rather than an
# owner, so these rows are the complete answer. Widening them to adds would
# select every unmapped script in the suite instead of the one owner.
covers bin/fm-file-event-lib.sh tests/fm-file-eventwait.test.sh
covers bin/fm-file-eventwait.py tests/fm-file-eventwait.test.sh

