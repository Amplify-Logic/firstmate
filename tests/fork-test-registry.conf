adds bin/fm-home-manifest.sh tests/fm-bootstrap.test.sh
# Account pinning has four owners: the helper's own suite, the two launch paths
# that resolve a pin, and bootstrap's registry validation. fm-account.sh is
# named by its own test, so the runner's reference fallback still reaches it and
# those rows are additive. The library's own rows are declared further down.
adds bin/fm-account.sh tests/fm-account.test.sh
adds bin/fm-account.sh tests/fm-primary.test.sh
adds bin/fm-account.sh tests/fm-spawn-account.test.sh
adds bin/fm-account.sh tests/fm-bootstrap.test.sh
# release-stale in bin/fm-lock.sh dispatches into the fork's handoff library
# and fails closed without it, and only the handoff suite pins that refusal.
# Upstream still owns bin/fm-lock* through the runner's session-bootstrap
# branch, so this row adds an owner rather than replacing one.
adds bin/fm-lock.sh tests/fm-primary-handoff.test.sh

# The glasses file-event wake is carried entirely by its own library and python
# helper. Its own suite names both of them as text, so the runner's reference
# fallback already answers for each path per script, and bin/fm-watch.sh
# sources the library, so the bin_consumers_of walk in families_for_unmapped_bin
# also answers with the watcher-wake-lock family upstream's own map gives the
# watcher. These rows therefore add the fork owner to an existing answer; a
# covers row would shadow it and fork_registry_assert_no_shadow refuses it.
adds bin/fm-file-event-lib.sh tests/fm-file-eventwait.test.sh
adds bin/fm-file-eventwait.py tests/fm-file-eventwait.test.sh

# The runner's map selects nothing for these fork-only declaration files, so
# the registry is the complete answer and a change to them no longer fails as
# unmapped.
covers tests/fork-test-registry.conf tests/fm-test-run.test.sh
covers tests/fork-test-registry.conf tests/fm-fork-surface.test.sh
covers fork-surface.conf tests/fm-fork-surface.test.sh
covers fork-surface.upstream-base tests/fm-fork-surface.test.sh
covers docs/fork-surface.md tests/fm-fork-surface.test.sh
covers docs/upstream-ported-ledger.txt tests/fm-upstream-ledger.test.sh

# The two shared libraries below are a different case from the declaration
# files above. Upstream reaches them through the other half of the runner's
# bin/* arm: families_for_unmapped_bin walks bin_consumers_of, the bin/ scripts
# that name a library, and resolves each consumer through the runner's own map.
# No test names the leak library, but bin/fm-leak-guard.sh and
# bin/fm-home-port.sh source it, and the walk resolves those two to the
# fork-surface and home-port suites. Only the spawn-account suite names the
# account library, but bin/fm-account.sh, bin/fm-primary.sh, bin/fm-spawn.sh
# and bin/fm-bootstrap.sh source it, and the walk resolves them to their curated
# families. Upstream therefore has a live owner for each path and these rows
# add the fork owner rather than replacing it.
adds bin/fm-leak-lib.sh tests/fm-fork-surface.test.sh
adds bin/fm-account-lib.sh tests/fm-account.test.sh
adds bin/fm-account-lib.sh tests/fm-primary.test.sh
adds bin/fm-account-lib.sh tests/fm-spawn-account.test.sh
adds bin/fm-account-lib.sh tests/fm-bootstrap.test.sh

# The ops command center has no hook in a core script, so these rows are its
# whole integration with the runner.
# No upstream case maps bin/fm-order.sh or bin/fm-tray.sh, but the runner's
# reference fallback resolves every suite naming a path as a per-script owner,
# and fork_registry_assert_no_shadow counts that owner whether or not the suite
# has a family, so the runner does answer for both paths and these rows add
# the fork owner to that answer.
# tests/fm-deck.test.sh drives both real scripts and is a further owner of each
# path; the Action Deck group declares that below, where the deck's own sources
# are declared.
# bin/fm-tray.sh has two owners. Its own suite is one, and the order suite is
# the other: fm-order.sh list calls fm-tray.sh counts, so a tray change can
# break the order suite. The order suite never names the tray path as text;
# the bin_consumers_of walk still reaches it, because bin/fm-order.sh names
# the tray script, and this row records that coupling explicitly.
adds bin/fm-order.sh tests/fm-order.test.sh
adds bin/fm-tray.sh tests/fm-tray.test.sh
adds bin/fm-tray.sh tests/fm-order.test.sh

# The captain's private reading, decision, chart-room and Action Deck surfaces
# have no hook in a core script either, so these rows are their whole
# integration with the runner. No upstream case maps any of these paths, but
# the runner's reference fallback resolves every suite naming a path as a
# per-script owner, so the runner does answer for them and every row here adds
# the fork owner to that answer.
#
# One owner could not have been found by upstream's fallback at all:
#   bin/fm-read.mjs      - bin/fm-chart-room.mjs imports its render(), so a
#                          change to the Markdown owner can break the chart
#                          room's report pages. The chart-room suite never
#                          names the path as text, and bin_consumers_of walks
#                          only bin/*.sh, so the .mjs import is invisible to it.
# One owner the bin_consumers_of walk does reach, recorded here explicitly:
#   bin/fm-chart-room.sh - bin/fm-overlay.sh calls its `url` command to decide
#                          whether a report earns a chart-room link, and the
#                          overlay suite asserts the URL that call returns.
# One further owner the reference fallback reaches only per script:
#   bin/fm-deck.sh       - the phone bridge serves /deck from this script over
#                          the real repository root, so the bridge suite drives
#                          it and asserts the fm-deck.v1 model it emits.
#                          The bridge suite names the path as text, so the
#                          fallback names it as a per-script owner even though
#                          the runner's own map gives that suite no family. A
#                          covers row would delete that owner, so the row adds
#                          the deck suite to that answer instead.
adds bin/fm-decision-surface.sh tests/fm-decision-surface.test.sh
adds bin/fm-decision-surface.mjs tests/fm-decision-surface.test.sh
adds bin/fm-read.sh tests/fm-read.test.sh
adds bin/fm-read.mjs tests/fm-read.test.sh
adds bin/fm-read.mjs tests/fm-chart-room.test.sh
adds bin/fm-chart-room.sh tests/fm-chart-room.test.sh
adds bin/fm-chart-room.sh tests/fm-overlay.test.sh
adds bin/fm-chart-room.mjs tests/fm-chart-room.test.sh
adds bin/fm-overlay.sh tests/fm-overlay.test.sh
adds bin/fm-deck.sh tests/fm-deck.test.sh
adds bin/fm-deck.sh tests/fm-bridge-view.test.sh
adds bin/fm-deck-render.py tests/fm-deck.test.sh

# The further owner the ops rows above left for this group: tests/fm-deck.test.sh
# drives the real bin/fm-order.sh and bin/fm-tray.sh over a fixture gateway log
# and fixture order files, so a change to either ops source can break the deck
# suite.
adds bin/fm-order.sh tests/fm-deck.test.sh
adds bin/fm-tray.sh tests/fm-deck.test.sh

# The fork-surface check's config/secret knob pass requires every declared
# knob path to be ignored, so it is an extra .gitignore owner alongside the
# upstream owners the runner's own map already selects.
adds .gitignore tests/fm-fork-surface.test.sh
# The private-report assertion requires the watch's own output paths to be
# ignored, so it is a further .gitignore owner beside the upstream readers.
adds .gitignore tests/fm-upstream-watch.test.sh

# The morning intake gate is fork-only, but its own suite names both scripts as
# text, so the runner's reference fallback still reaches them and the lane rule
# makes these additive rows rather than exclusive ones. A covers row is reserved
# for a fork-only declaration file no test text names at all.
adds bin/fm-morning-intake*.sh tests/fm-morning-intake.test.sh
# The launchd writer is shared with the channel intake gate, whose suite names
# it and stays in the runner's own map, so upstream still answers
# session-bootstrap for this path and the morning row has to add to that answer
# rather than replace it.
adds bin/fm-launchd-schedule-lib.sh tests/fm-morning-intake.test.sh

# The Swift desk floater is launched only through bin/fm-desk-floater.sh, and
# no test names its package sources as text, so the runner has no answer for
# them and the desk voice suite (which drives that launcher and runs the
# package's Swift tests) is the whole one.
covers desk-floater/Package.swift tests/fm-deepgram-desk.test.sh
covers desk-floater/Sources/* tests/fm-deepgram-desk.test.sh
covers desk-floater/Tests/* tests/fm-deepgram-desk.test.sh
