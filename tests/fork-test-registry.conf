family pure-contract-unit tests/fm-fork-surface.test.sh
family session-bootstrap tests/fm-upstream.test.sh
family session-bootstrap tests/fm-upstream-ledger.test.sh
family session-bootstrap tests/fm-upstream-watch.test.sh
family pure-contract-unit tests/fm-baby-menu-quota.test.sh
family session-bootstrap tests/fm-home-manifest.test.sh
family backend-dispatch tests/fm-spawn-account.test.sh
family pure-contract-unit tests/fm-action-gateway-v2.test.sh
family pure-contract-unit tests/fm-bridge-view.test.sh
family session-bootstrap tests/fm-morning-intake.test.sh

# The visible-format library, the title owner and the outcome resolver are
# fork-only presentation sources, but each is still named as text by some test
# in the suite (the runner's own test names the format library in its fixture,
# the spawn presentation test names the title owner, and the outcome resolver
# is named by its own test), so upstream's reference fallback reaches all
# three. These rows add the fork owners to that answer; a covers row would
# shadow a live upstream owner and fork_registry_assert_no_shadow refuses it.
adds bin/fm-visible-format-lib.sh tests/fm-visible-status.test.sh
adds bin/fm-visible-format-lib.sh tests/fm-herdr-layout-preview-e2e.test.sh
adds bin/fm-visible-format-lib.sh tests/fm-deck.test.sh
adds bin/fm-visible-title.sh tests/fm-visible-status.test.sh
adds bin/fm-visible-title.sh tests/fm-spawn-herdr-presentation.test.sh
adds bin/fm-task-outcome.sh tests/fm-project-presentation.test.sh

# The runner's own map still reaches these paths through its reference
# fallback, because a test names each of them, so the fork owner is added to
# that answer rather than replacing it. A covers row here would delete those
# owners silently, and fork_registry_assert_no_shadow refuses it.
adds bin/fm-fork-test-registry-lib.sh tests/fm-test-run.test.sh
adds bin/fm-fork-test-registry-lib.sh tests/fm-fork-surface.test.sh
adds bin/fm-fork-surface.sh tests/fm-fork-surface.test.sh
adds bin/fm-leak-guard.sh tests/fm-fork-surface.test.sh
adds bin/fm-upstream-lib.sh tests/fm-upstream.test.sh
adds bin/fm-upstream-lib.sh tests/fm-upstream-ledger.test.sh
adds bin/fm-upstream-watch*.sh tests/fm-upstream-watch.test.sh
adds bin/fm-home-manifest.sh tests/fm-home-manifest.test.sh
adds bin/fm-home-manifest.sh tests/fm-bootstrap.test.sh
# Account pinning has four owners: the helper's own suite, the two launch paths
# that resolve a pin, and bootstrap's registry validation. fm-account.sh is
# named by its own test, so the runner's reference fallback still reaches it and
# those rows are additive; nothing names the library, so its rows are the
# complete answer for it.
adds bin/fm-account.sh tests/fm-account.test.sh
adds bin/fm-account.sh tests/fm-primary.test.sh
adds bin/fm-account.sh tests/fm-spawn-account.test.sh
adds bin/fm-account.sh tests/fm-bootstrap.test.sh
# release-stale in bin/fm-lock.sh dispatches into the fork's handoff library
# and fails closed without it, and only the handoff suite pins that refusal.
# Upstream still owns bin/fm-lock* through the runner's session-bootstrap
# branch, so this row adds an owner rather than replacing one.
adds bin/fm-lock.sh tests/fm-primary-handoff.test.sh

# The runner's map selects nothing for these fork-only paths, so the registry
# is the complete answer and a change to them no longer fails as unmapped.
covers tests/fork-test-registry.conf tests/fm-test-run.test.sh
covers tests/fork-test-registry.conf tests/fm-fork-surface.test.sh
covers bin/fm-leak-lib.sh tests/fm-fork-surface.test.sh
covers fork-surface.conf tests/fm-fork-surface.test.sh
covers fork-surface.upstream-base tests/fm-fork-surface.test.sh
covers docs/fork-surface.md tests/fm-fork-surface.test.sh
covers docs/upstream-ported-ledger.txt tests/fm-upstream-ledger.test.sh
covers bin/fm-account-lib.sh tests/fm-account.test.sh
covers bin/fm-account-lib.sh tests/fm-primary.test.sh
covers bin/fm-account-lib.sh tests/fm-spawn-account.test.sh
covers bin/fm-account-lib.sh tests/fm-bootstrap.test.sh

# The fork-surface check's config/secret knob pass requires every declared
# knob path to be ignored, so it is an extra .gitignore owner alongside the
# upstream owners the runner's own map already selects.
adds .gitignore tests/fm-fork-surface.test.sh
# The private-report assertion requires the watch's own output paths to be
# ignored, so it is a further .gitignore owner beside the upstream readers.
adds .gitignore tests/fm-upstream-watch.test.sh

# The morning intake gate is fork-only, but its own suite names both scripts as
# text, so the runner's reference fallback still reaches them and the lane rule
# makes these additive rows rather than exclusive ones. A covers row is reserved
# for a path no test text names at all.
adds bin/fm-morning-intake*.sh tests/fm-morning-intake.test.sh
# The launchd writer is shared with the channel intake gate, whose suite names
# it and stays in the runner's own map, so upstream still answers
# session-bootstrap for this path and the morning row has to add to that answer
# rather than replace it.
adds bin/fm-launchd-schedule-lib.sh tests/fm-morning-intake.test.sh
