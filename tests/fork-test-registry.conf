# Fork-only test ownership overlay for bin/fm-test-run.sh.
# The parser and exact row grammar live in bin/fm-fork-test-registry-lib.sh.

family pure-contract-unit tests/fm-fork-surface.test.sh
family session-bootstrap tests/fm-upstream.test.sh
family session-bootstrap tests/fm-upstream-ledger.test.sh
family session-bootstrap tests/fm-upstream-watch.test.sh

# The runner's own map still reaches these paths through its reference
# fallback, because a test names each of them, so the fork owner is added to
# that answer rather than replacing it. A covers row here would delete those
# owners silently, and fork_registry_assert_no_shadow refuses it.
adds bin/fm-fork-test-registry-lib.sh tests/fm-test-run.test.sh
adds bin/fm-fork-test-registry-lib.sh tests/fm-fork-surface.test.sh
adds bin/fm-fork-surface.sh tests/fm-fork-surface.test.sh
adds bin/fm-leak-guard.sh tests/fm-fork-surface.test.sh
adds bin/fm-upstream-lib.sh tests/fm-upstream.test.sh
adds bin/fm-upstream-lib.sh tests/fm-upstream-ledger.test.sh
adds bin/fm-upstream-watch*.sh tests/fm-upstream-watch.test.sh

# The runner's map selects nothing for these fork-only paths, so the registry
# is the complete answer and a change to them no longer fails as unmapped.
covers tests/fork-test-registry.conf tests/fm-test-run.test.sh
covers tests/fork-test-registry.conf tests/fm-fork-surface.test.sh
covers bin/fm-leak-lib.sh tests/fm-fork-surface.test.sh
covers fork-surface.conf tests/fm-fork-surface.test.sh
covers fork-surface.upstream-base tests/fm-fork-surface.test.sh
covers docs/fork-surface.md tests/fm-fork-surface.test.sh
covers docs/upstream-ported-ledger.txt tests/fm-upstream-ledger.test.sh
covers docs/upstream-ported-ledger.txt tests/fm-upstream-watch.test.sh

# The fork-surface check's config/secret knob pass requires every declared
# knob path to be ignored, so it is an extra .gitignore owner alongside the
# upstream owners the runner's own map already selects.
adds .gitignore tests/fm-fork-surface.test.sh
# The private-report assertion requires the watch's own output paths to be
# ignored, so it is a further .gitignore owner beside the upstream readers.
adds .gitignore tests/fm-upstream-watch.test.sh
