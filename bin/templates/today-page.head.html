<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --ink:#132033; --ink-2:#3e4f66; --ink-3:#6b7a90;
  --line:#d7e0ec; --line-2:#e8eef6; --accent:#0b4f8a; --accent-ink:#ffffff; --accent-soft:#e3eef9;
  --ok:#1d7a4f; --ok-soft:#e2f3ea; --warn:#9a6300; --warn-soft:#fdf1d8; --bad:#a8322b; --bad-soft:#fbe5e3; --info:#2f5f9e; --info-soft:#e6eef9;
  --obs:#0b4f8a; --inf:#7a5a00; --unv:#7a2e80;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1622; --panel:#141f2e; --ink:#e6edf6; --ink-2:#b7c4d6; --ink-3:#8593a8;
    --line:#26354a; --line-2:#1d2a3c; --accent:#6fb1ea; --accent-ink:#0b1a2b; --accent-soft:#15304a;
    --ok:#5fcf92; --ok-soft:#123324; --warn:#f0c264; --warn-soft:#3a2d0c; --bad:#f08a82; --bad-soft:#3d1a18; --info:#8fb6ec; --info-soft:#17304d;
    --obs:#6fb1ea; --inf:#e0b95a; --unv:#cf8fd6;
  }
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;margin:0;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:34px 0 10px;letter-spacing:-.005em}
h2 small{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--ink-3);margin-left:10px}
h3.sub{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.meta{font-size:13px;color:var(--ink-2);text-align:right;max-width:540px}
.meta .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0 6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;line-height:1;color:var(--accent)}
.tile .l{font-size:13px;color:var(--ink-2);margin-top:6px}
.tile .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--ink-2);margin:14px 0}
.note b{color:var(--ink)}
.note.warnline{border-left-color:var(--warn)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.tablewrap{overflow-x:auto;border-radius:10px}
thead th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
tbody td{padding:12px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--accent-soft)}
tr.closed td{color:var(--ink-3)}
details.replyd{display:inline-block;vertical-align:baseline;margin-left:8px}
details.replyd[open]{display:block;margin:8px 0 0}
details.replyd>summary{list-style:none;cursor:pointer;display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-3);padding:1px 6px;border:1px dashed var(--line);border-radius:4px;user-select:none}
details.replyd>summary::-webkit-details-marker{display:none}
details.replyd>summary:hover{color:var(--ink-2);border-color:var(--accent)}
details.replyd[open]>summary{margin-bottom:8px;border-style:solid}
form.reply{display:flex;gap:8px;align-items:center}
form.reply input[type=text]{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
form.reply input[type=text]::placeholder{color:var(--ink-3)}
form.reply button{font:inherit;font-size:12.5px;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink-2);cursor:pointer;white-space:nowrap}
form.reply button:hover{border-color:var(--accent);color:var(--ink)}
form.reply .ack{font-size:12px;color:var(--ok);white-space:nowrap}
tr.closed td.who{color:var(--ink-2)}
td.who{font-weight:600;white-space:nowrap}
td.who .org{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3)}
td.what{min-width:320px;color:var(--ink)}
td.what .ctx{display:block;color:var(--ink-2);font-size:13px;margin-top:3px}
td.what .next{display:block;color:var(--ink);font-size:13px;margin-top:6px}
td.what .next b{color:var(--accent)}
td.since{white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}
td.links{white-space:nowrap}
td.links a{display:inline-block;font-size:12.5px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;margin:0 4px 4px 0;background:var(--bg)}
td.links a:hover{border-color:var(--accent)}
td.links .nolink{display:inline-block;font-size:12px;color:var(--ink-3);font-style:italic}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.prov{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;margin-top:6px}
.prov.obs{color:var(--obs)} .prov.inf{color:var(--inf)} .prov.unv{color:var(--unv)}
.id{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-family:var(--serif);font-size:17px;margin:0 0 8px;font-weight:600}
.card ol,.card ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px}
.card li{margin:5px 0}
.card li b{color:var(--ink)}
.rec{margin-top:8px;font-size:13px;color:var(--ink-2)}
.rec b{color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-3);margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.done{color:var(--ink-2);font-size:14px}
.done li{margin:3px 0}
@media print{ body{background:#fff} .tile,.card,table{break-inside:avoid} }

/* --- private improved variant: presentation only --- */
td.since .lab{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
td.since .age{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:2px;white-space:normal}
.strips{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin:16px 0 6px}
@media (max-width:760px){.strips{grid-template-columns:minmax(0,1fr)}}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.strip.now{border-left:4px solid var(--accent)}
.strip.unv{border-left:4px solid var(--unv)}
.strip h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 2px}
.strip .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 10px}
.strip .grp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:12px 0 6px}
.strip .grp:first-of-type{margin-top:0}
.strip ol{margin:0;padding-left:20px;font-size:14px;color:var(--ink-2)}
.strip ol li{margin:7px 0}
.strip ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.strip ul li{margin:7px 0}
.strip a.jump{font-weight:600;border-bottom:1px solid transparent}
.strip a.jump:hover{border-bottom-color:var(--accent)}
.strip .why{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
tr:target td{background:var(--accent-soft)}
details{margin:20px 0;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.watch-line{padding:12px 16px;margin:8px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.watch-line .why{display:block;color:var(--ink-3);font-size:13px;margin-top:5px;overflow-wrap:anywhere}
</style>
</head><body><div class="wrap">
